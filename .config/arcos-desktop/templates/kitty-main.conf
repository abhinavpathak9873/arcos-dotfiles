include /etc/xdg/kitty/catppuccin-frappe.conf
include /etc/xdg/kitty/abhi-look.conf
include ~/.config/arcos-desktop/kitty.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.5

# Compositor close shortcuts must close immediately, even if a shell is still
# running. This keeps Meta+Q predictable and prevents Kitty confirmation UI
# from making the key appear to have been ignored.
confirm_os_window_close 0

# The compositor owns Super/Meta shortcuts. Kitty tab shortcuts deliberately
# use Alt+Shift so window-manager bindings can never leak a digit into a shell.

map alt+shift+1 goto_tab 1
map alt+shift+2 goto_tab 2
map alt+shift+3 goto_tab 3
map alt+shift+4 goto_tab 4
map alt+shift+5 goto_tab 5
map alt+shift+6 goto_tab 6
map alt+shift+7 goto_tab 7
map alt+shift+8 goto_tab 8
map alt+shift+9 goto_tab 9
map alt+shift+0 goto_tab 10
